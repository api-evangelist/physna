aid: physna
name: Physna
description: >-
  Physna is a geometric search and 3D deep-learning platform that lets you
  search, compare, analyze, and organize 3D models and physical parts by their
  actual geometry rather than by filename or metadata. Its public REST API (v2,
  OpenAPI 3.0) exposes model ingestion and reprocessing, geometric search
  (part-to-part, part-in-part, part, scan, visual, and geo-related matches),
  image-based search, collections and folders, model/collection metadata and
  metadata keys, assembly-tree traversal, match reports, user management, and
  client-credential provisioning. The API is JSON over HTTPS, is authenticated
  with OAuth 2.0 through Physna's Okta authorization server, and is used to
  detect duplicate designs, discover alternative components, and organize design
  inventory across manufacturing, engineering, and AI training use cases.
