components:
  schemas:
    MetadataFilterData:
      properties:
        metadataKeyId:
          type: number
          format: double
        name:
          type: string
        values:
          items:
            type: string
          type: array
      required:
      - metadataKeyId
      - name
      - values
      type: object
      additionalProperties: false
    AssemblyPart:
      properties:
        type:
          type: string
          enum:
          - assemblyPart
          nullable: false
        modelId:
          type: string
        occurrences:
          type: number
          format: double
      required:
      - type
      - modelId
      - occurrences
      type: object
      additionalProperties: false
    MatchReportGroups:
      properties:
        groups:
          items:
            $ref: '#/components/schemas/MatchReportGroup'
          type: array
      required:
      - groups
      type: object
      additionalProperties: false
    Pick_Folder.id-or-name_:
      properties:
        id:
          type: number
          format: double
        name:
          type: string
      required:
      - id
      - name
      type: object
      description: From T, pick a set of properties whose keys are in the union K
    AddToCollectionResponseBody:
      $ref: '#/components/schemas/CreateCollectionResponseBody'
    Label:
      properties:
        displayName:
          type: string
        source:
          type: string
        createdAt:
          type: string
          format: date-time
        rejected:
          type: boolean
      required:
      - displayName
      - source
      - createdAt
      type: object
      additionalProperties: false
    GetPartMatchesResponse:
      properties:
        matches:
          items:
            $ref: '#/components/schemas/PartMatch'
          type: array
        pageData:
          $ref: '#/components/schemas/PageData'
        filterData:
          $ref: '#/components/schemas/MatchFilterData'
      required:
      - matches
      - pageData
      - filterData
      type: object
      additionalProperties: false
    GetModelStateReportResponse:
      properties:
        states:
          $ref: '#/components/schemas/ModelStateReport'
      required:
      - states
      type: object
      additionalProperties: false
    AssemblyTree:
      properties:
        type:
          type: string
          enum:
          - assemblyTree
          nullable: false
        modelId:
          type: string
        children:
          items:
            anyOf:
            - $ref: '#/components/schemas/AssemblyPart'
            - $ref: '#/components/schemas/SubAssembly'
          type: array
      required:
      - type
      - modelId
      - children
      type: object
      additionalProperties: false
    MetadataResponse:
      properties:
        pageData:
          $ref: '#/components/schemas/PageData'
        metadata:
          items:
            $ref: '#/components/schemas/Metadata'
          type: array
      required:
      - pageData
      - metadata
      type: object
      additionalProperties: false
    ModelMatch:
      properties:
        matchPercentage:
          type: number
          format: double
        matchedModel:
          $ref: '#/components/schemas/ModelWithMetadata'
      required:
      - matchPercentage
      - matchedModel
      type: object
      additionalProperties: false
    MatchFilterData:
      properties:
        folders:
          items:
            $ref: '#/components/schemas/Pick_Folder.id-or-name_'
          type: array
        metadata:
          items:
            $ref: '#/components/schemas/MetadataFilterData'
          type: array
        createdAt:
          items:
            type: string
          type: array
        isAssembly:
          items:
